<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="40px" style="background: transparent;">
  <defs>
    <!-- Modern Vibrant Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />   <!-- Deep Purple -->
      <stop offset="50%" stop-color="#3B82F6" />  <!-- Bright Blue -->
      <stop offset="100%" stop-color="#10B981" /> <!-- Emerald Green -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Dynamic Icon -->
  <g transform="translate(10, 0)">
    <circle cx="100" cy="100" r="70" fill="url(#logo-grad)" opacity="0.15" />
    <circle cx="100" cy="100" r="55" fill="none" stroke="url(#logo-grad)" stroke-width="4" />
    
    <!-- Growth Chart / Arrow inside Circle -->
    <path d="M 80,120 L 95,105 L 110,120 L 130,90" fill="none" stroke="url(#logo-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 120,90 L 130,90 L 130,100" fill="none" stroke="url(#logo-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Premium Typography -->
  <text x="210" y="118" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    FundMe
  </text>
  <text x="210" y="152" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#9CA3AF" letter-spacing="3" opacity="0.8">
    SMART CONTRACTS
  </text>
</svg>
